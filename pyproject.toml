[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spack-agent"
version = "0.1.0"
description = "Iterative AI agent for Spack package recipes with isolated, persistent-cache build verification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spack-agent = "spack_agent.cli:main"

[tool.setuptools.packages.find]
include = ["spack_agent*"]